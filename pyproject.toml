[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graveyard"
version = "0.0.1"
description = "A per-repo log of failed approaches, so coding agents stop repeating them."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["graveyard*"]
