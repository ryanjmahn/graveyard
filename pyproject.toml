[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graveyard"
version = "0.0.1"
description = "A per-repo log of failed approaches, so coding agents stop repeating them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
graveyard = "graveyard.cli:main"
graveyard-mcp = "graveyard.mcp_server:main"

[tool.setuptools.packages.find]
include = ["graveyard*"]
